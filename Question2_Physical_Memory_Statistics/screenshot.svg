  <text x="410" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">xv6 Terminal - Question 2: Physical Memory Statistics</text>
  <g>
    <text x="25" y="65" fill="#38bdf8" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold">$ memtest</text>
    <text x="25" y="85" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ memtest</text>
    <text x="25" y="105" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="125" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">    xv6 Question 2: Physical Memory Statistics Test     </text>
    <text x="25" y="145" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="165" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 1: Initial Baseline]</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Total System Pages : 56320 (220 MB)</text>
    <text x="25" y="205" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56302 (225208 KB)</text>
    <text x="25" y="225" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Process User Pages : 4 (16 KB)</text>
    <text x="25" y="245" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Page Table Pages   : 2 (8 KB)</text>
    <text x="25" y="265" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">--- Growing heap by 4 pages (16384 bytes) via sbrk() ---</text>
    <text x="25" y="285" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 2: After sbrk(4 * 4096)]</text>
    <text x="25" y="305" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Total System Pages : 56320 (220 MB)</text>
    <text x="25" y="325" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56298 (225192 KB)</text>
    <text x="25" y="345" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Process User Pages : 8 (32 KB)</text>
    <text x="25" y="365" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Page Table Pages   : 2 (8 KB)</text>
    <text x="25" y="385" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">Allocation Verification:</text>
    <text x="25" y="405" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  User pages delta : +4 pages (Expected: +4)</text>
    <text x="25" y="425" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free pages delta : -4 pages (Expected: -4)</text>
    <text x="25" y="445" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">--- Forking child process to observe free_pages change ---</text>
    <text x="25" y="465" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD PID 4] Running:</text>
    <text x="25" y="485" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">    Free Physical Pages : 56288</text>
    <text x="25" y="505" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">    Process User Pages  : 8</text>
    <text x="25" y="525" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">    Page Table Pages    : 2</text>
    <text x="25" y="545" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 3: After Child Exits and is Reaped]</text>
    <text x="25" y="565" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Total System Pages : 56320 (220 MB)</text>
    <text x="25" y="585" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56298 (225192 KB)</text>
    <text x="25" y="605" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Process User Pages : 8 (32 KB)</text>
    <text x="25" y="625" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Page Table Pages   : 2 (8 KB)</text>
    <text x="25" y="645" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">--------------------------------------------------------</text>
    <text x="25" y="665" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">Memory Leak Verification:</text>
    <text x="25" y="685" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Pre-fork free pages : 56298</text>
    <text x="25" y="705" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Post-reap free pages: 56298</text>
    <text x="25" y="725" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Delta               : 0 (Exact match!)</text>
    <text x="25" y="745" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Status              : [PASSED] ZERO MEMORY LEAK DETECTED!</text>
    <text x="25" y="765" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="785" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ </text>
