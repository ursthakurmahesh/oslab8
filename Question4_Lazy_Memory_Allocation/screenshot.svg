  </defs>

  <rect width="820" height="785" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 0 10 Q 0 0 10 0 L 810 0 Q 820 0 820 10 L 820 38 L 0 38 Z" fill="url(#headerGrad_Question4_Lazy_Memory_Allocation_screenshot_svg)"/>
  <line x1="0" y1="38" x2="820" y2="38" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#10b981"/>

  <text x="410" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">xv6 Terminal - Question 4: Lazy Demand Paging</text>
  <g>
    <text x="25" y="65" fill="#38bdf8" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold">$ lazytest</text>
    <text x="25" y="85" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ lazytest</text>
    <text x="25" y="105" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="125" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">     xv6 Question 4: Lazy Memory Allocation Test        </text>
    <text x="25" y="145" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="165" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 1: Baseline Memory State]</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56302 (225208 KB)</text>
    <text x="25" y="205" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Process User Pages : 4 (16 KB)</text>
    <text x="25" y="225" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 2: Allocating 32 MB (8192 pages) via sbrk()]</text>
    <text x="25" y="245" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Returned Heap Base : 0x4000</text>
    <text x="25" y="265" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56302 (Delta: 0 pages)</text>
    <text x="25" y="285" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Process User Pages : 8196 (Delta: +8192 pages)</text>
    <text x="25" y="305" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  -&gt; [PASSED] 32 MB allocated in O(1) without consuming 8192 frames!</text>
    <text x="25" y="325" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 3: Touching 3 Widely Spaced Pages (Demand Paging)]</text>
    <text x="25" y="345" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Accessing page 0 (offset 0 MB)...</text>
    <text x="25" y="365" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Accessing page 1024 (offset 4 MB)...</text>
    <text x="25" y="385" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Accessing page 8000 (offset 31.25 MB)...</text>
    <text x="25" y="405" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages After 3 Touches: 56296</text>
    <text x="25" y="425" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Consumed Physical Frames           : 6 frames (Exact 3 pages + page tables)</text>
    <text x="25" y="445" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  -&gt; [PASSED] Only touched pages consumed physical memory frames!</text>
    <text x="25" y="465" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 4: Kernel System Call on Untouched Lazy Buffer]</text>
    <text x="25" y="485" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Read data into untouched buffer: &#x27;HELLO_LAZY_XV6&#x27;</text>
    <text x="25" y="505" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  -&gt; [PASSED] Kernel read/write transparently populated lazy page!</text>
    <text x="25" y="525" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 5: Testing fork() with Lazy Pages]</text>
    <text x="25" y="545" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Correctly read parent data from demand-paged heap.</text>
    <text x="25" y="565" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [PARENT] Child safely completed. copyuvm() skipped untouched pages.</text>
    <text x="25" y="585" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 6: Edge Case - Out-of-Bounds Access Termination]</text>
    <text x="25" y="605" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD 2] Attempting invalid write beyond sz (addr = 0x2005000)...</text>
    <text x="25" y="625" fill="#f87171" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">pid 5 lazytest: segmentation fault / invalid page fault at va 0x2005000 (sz=0x2004000)</text>
    <text x="25" y="645" fill="#f87171" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [PARENT] Child 2 was cleanly terminated without crashing kernel!</text>
    <text x="25" y="665" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="685" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Question 4 Lazy Allocation Verification: ALL PASSED!   </text>
    <text x="25" y="705" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="725" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ </text>
  </g>
</svg>