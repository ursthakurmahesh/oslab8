  <circle cx="62" cy="19" r="6" fill="#10b981"/>

  <text x="410" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">xv6 Terminal - Question 5: Copy-on-Write Fork</text>
  <g>
    <text x="25" y="65" fill="#38bdf8" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold">$ cowtest</text>
    <text x="25" y="85" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ cowtest</text>
    <text x="25" y="105" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="125" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">       xv6 Question 5: Copy-on-Write (COW) Test         </text>
    <text x="25" y="145" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="165" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 1] Baseline Memory State:</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56302</text>
    <text x="25" y="205" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 2] Allocating and Writing 32 Pages (128 KB)...</text>
    <text x="25" y="225" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages: 56270 (Consumed 32 pages)</text>
    <text x="25" y="245" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 3] Calling fork() with Copy-on-Write Sharing...</text>
    <text x="25" y="265" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] All 32 pages verified in read-only shared mode!</text>
    <text x="25" y="285" fill="#f87171" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Modifying page 0 (triggering COW fault)...</text>
    <text x="25" y="305" fill="#f87171" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Page 0 successfully updated to &#x27;Z&#x27; via COW fault!</text>
    <text x="25" y="325" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Free Physical Pages Immediately After Fork: 56268</text>
    <text x="25" y="345" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Memory Overhead for Fork: 2 pages (Only page tables cloned, NOT data pages!)</text>
    <text x="25" y="365" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [PARENT] Child exited. Verifying Parent Page 0 Unaltered:</text>
    <text x="25" y="385" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Parent buf[0] = &#x27;A&#x27; (Expected: &#x27;A&#x27; - Complete Memory Isolation)</text>
    <text x="25" y="405" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 4] Post-Execution Memory Leak Verification:</text>
    <text x="25" y="425" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Pre-fork Free Pages : 56270</text>
    <text x="25" y="445" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  Post-reap Free Pages: 56270</text>
    <text x="25" y="465" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Delta               : 0 (Exact match!)</text>
    <text x="25" y="485" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  Status              : [PASSED] COW FORK AND ZERO LEAK VERIFIED!</text>
    <text x="25" y="505" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="525" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ </text>
  </g>
