<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 465" width="820" height="465">
  <defs>
    <linearGradient id="headerGrad_Question7_Shared_Memory_screenshot_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="820" height="465" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 0 10 Q 0 0 10 0 L 810 0 Q 820 0 820 10 L 820 38 L 0 38 Z" fill="url(#headerGrad_Question7_Shared_Memory_screenshot_svg)"/>
  <line x1="0" y1="38" x2="820" y2="38" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#10b981"/>

  <text x="410" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">xv6 Terminal - Question 7: Shared Memory IPC</text>
  <g>
    <text x="25" y="65" fill="#38bdf8" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold">$ shmtest</text>
    <text x="25" y="85" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ shmtest</text>
    <text x="25" y="105" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="125" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">       xv6 Question 7: Inter-Process Shared Memory      </text>
    <text x="25" y="145" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="165" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 1] Parent allocating shared region key 4242...</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  -&gt; Obtained shmid = 0</text>
    <text x="25" y="205" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  -&gt; Attached shared page at VA: 0x4000</text>
    <text x="25" y="225" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  -&gt; Parent wrote to shared memory: &#x27;GREETINGS_FROM_PARENT&#x27;</text>
    <text x="25" y="245" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 2] Forking child process to access shared memory...</text>
    <text x="25" y="265" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Attached shared memory at VA: 0x4000</text>
    <text x="25" y="285" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Read from parent: &#x27;GREETINGS_FROM_PARENT&#x27;</text>
    <text x="25" y="305" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  [CHILD] Overwrote shared memory with: &#x27;ACK_FROM_CHILD_PROCESS_PID_4&#x27;</text>
    <text x="25" y="325" fill="#fbbf24" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">[Phase 3] Parent verifying child&#x27;s update in shared memory:</text>
    <text x="25" y="345" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">  -&gt; Parent read: &#x27;ACK_FROM_CHILD_PROCESS_PID_4&#x27;</text>
    <text x="25" y="365" fill="#4ade80" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold">  -&gt; [PASSED] Bidirectional shared memory IPC verified across distinct address spaces!</text>
    <text x="25" y="385" fill="#94a3b8" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">========================================================</text>
    <text x="25" y="405" fill="#e2e8f0" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="normal">$ </text>
  </g>
</svg>